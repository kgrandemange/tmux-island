name: Release

# Pushing a tag such as v1.0.0 builds the app from this exact source and publishes it on GitHub,
# so the download is always reproducible from the tagged commit.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches VERSION
        run: |
          [ "v$(cat VERSION)" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match VERSION $(cat VERSION)"; exit 1; }
      - name: Test
        run: |
          command -v tmux || brew install tmux
          swift test
      - name: Package
        run: ./scripts/package.sh
      - name: Verify the checksum
        run: cd build/release && shasum -a 256 -c TmuxIsland.zip.sha256
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/release/TmuxIsland.zip build/release/TmuxIsland.zip.sha256 \
            --title "TmuxIsland ${GITHUB_REF_NAME#v}" \
            --notes-file <(./scripts/release-notes.sh "${GITHUB_REF_NAME#v}")
